name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build .wgt
        run: |
          VERSION=$(tr '\n' ' ' < config.xml | grep -oP '<widget[^>]*\sversion="\K[0-9.]+')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          zip -X TVBrowser.wgt config.xml index.html style.css app.js sites.js icon.png
          unzip -l TVBrowser.wgt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" TVBrowser.wgt \
            --title "TV ბრაუზერი ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "ავტომატური აწყობა: ${GITHUB_SHA::7}" --latest
